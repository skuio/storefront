openapi: 3.1.0
info:
  title: Store API
  version: "1.0"
  description: |
    The contract between a store built on the SKU.io storefront kit and its operations system.
    Base path `/api/skuio/v1`. Money is integer minor units + ISO currency.

    Auth is a bearer key. A consumer obtains one through the owner-approved connect flow
    (`GET /admin/connect` in the browser, then `POST /connect/token` server to server), or the
    store's `STORE_API_KEY` secret is used as a break-glass. Every endpoint except
    `POST /connect/token` requires it.
servers:
  - url: https://{store}/api/skuio/v1
    variables: { store: { default: www.example.com } }
security: [{ bearer: [] }]
paths:
  /connect/token:
    post:
      operationId: exchangeConnectCode
      security: []
      description: |
        Trade the one-time code from an approved `/admin/connect` for this connection's API key.
        Unauthenticated: the code is the credential. Works exactly once; the `redirect_uri` must
        equal the one the code was issued for. Failures count against the caller's address.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TokenRequest' } } }
      responses:
        '201': { description: Key issued, content: { application/json: { schema: { $ref: '#/components/schemas/TokenEnvelope' } } } }
        '400': { description: invalid_grant — unknown, used or expired code, or a redirect_uri mismatch, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
  /connect:
    get:
      operationId: currentConnection
      description: The connection behind the bearer key, or `null` when the STORE_API_KEY secret was used.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { oneOf: [{ $ref: '#/components/schemas/Connection' }, { type: 'null' }] } } } } } }
    delete:
      operationId: revokeCurrentConnection
      description: Revoke the connection behind the bearer key. Its key is a 401 from then on.
      responses:
        '204': { description: Revoked }
        '409': { description: The STORE_API_KEY secret is not a connection, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /health:
    get:
      operationId: health
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/HealthEnvelope' } } } }
  /orders:
    get:
      operationId: listOrders
      parameters:
        - { name: updated_since, in: query, schema: { type: string, format: date-time }, description: Inclusive watermark }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Orders oldest-updated first
          content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Order' } }, next_cursor: { type: [string, 'null'] } } } } }
  /orders/{id}:
    get:
      operationId: getOrder
      description: >-
        One order. When the order was paid through stripe or paypal and payment.fee is still null, the store first
        asks the processor for the fee, stores it (bumping updated_at) and returns it. A processor failure never fails
        this request: the order comes back with fee null. GET /orders (the list) never calls the processor.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OrderEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateOrder
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                external_reference: { type: [string, 'null'], maxLength: 64 }
                status: { type: string, enum: [cancelled] }
                payment:
                  type: object
                  properties:
                    status: { type: string, enum: [paid, refunded, failed] }
                    provider: { type: string }
                    reference: { type: [string, 'null'] }
                    paid_at: { type: string, format: date-time }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/OrderEnvelope' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /orders/{id}/fulfillments:
    post:
      operationId: createFulfillment
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FulfillmentInput' } } }
      responses:
        '201': { description: Recorded, content: { application/json: { schema: { $ref: '#/components/schemas/FulfillmentEnvelope' } } } }
        '200': { description: Already recorded (same external_id), content: { application/json: { schema: { $ref: '#/components/schemas/FulfillmentEnvelope' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /quotes:
    get:
      operationId: listQuotes
      description: |
        Quote requests and their offers, oldest-updated first (scope `quotes`). Offers past `expires_at`
        are moved to `expired` before the page is read. Poll it like `/orders`: overlap the watermark
        and de-duplicate by `id`.
      parameters:
        - { name: updated_since, in: query, schema: { type: string, format: date-time }, description: Inclusive watermark }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Quotes oldest-updated first
          content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Quote' } }, next_cursor: { type: [string, 'null'] } } } } }
        '403': { description: The connection lacks the `quotes` scope, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /quotes/{id}:
    get:
      operationId: getQuote
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/QuoteEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateQuote
      description: |
        Stamp `external_reference`, withdraw the quote (`status: cancelled`), or price it with an `offer`.
        An offer replaces the lines (it may change quantities, drop lines or add a SKU the store does not
        list, which then needs a `name`), moves the quote to `quoted` and emails the buyer a link to accept
        it. Re-offering a `quoted` or `expired` quote revises it. Accepting is the buyer's alone: it places a
        pay-later order at the offered prices, which arrives through `GET /orders` with `metadata.quote_id`.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                external_reference: { type: [string, 'null'], maxLength: 64 }
                status: { type: string, enum: [cancelled] }
                offer: { $ref: '#/components/schemas/QuoteOffer' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/QuoteEnvelope' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /inventory:
    put:
      operationId: putInventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    required: [sku, available]
                    properties:
                      sku: { type: string }
                      available: { type: integer, minimum: 0 }
                      allow_backorder: { type: boolean }
      responses:
        '200': { description: Applied, content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { updated: { type: integer }, unknown_skus: { type: array, items: { type: string } } } } } } } } }
  /products:
    get:
      operationId: listProducts
      description: |
        The store's catalog, oldest-updated first, for an operations system importing
        or reconciling it. Includes inactive products so a withdrawal is visible.
      parameters:
        - { name: updated_since, in: query, schema: { type: string, format: date-time }, description: Inclusive watermark }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: active, in: query, schema: { type: boolean }, description: Omit for every product }
      responses:
        '200':
          description: Products oldest-updated first
          content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Product' } }, next_cursor: { type: [string, 'null'] } } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
    put:
      operationId: putProducts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [products]
              properties:
                products: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/ProductInput' } }
      responses:
        '200': { description: Upserted, content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { upserted: { type: integer } } } } } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /products/{sku}:
    get:
      operationId: getProduct
      parameters: [{ name: sku, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Product' } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deactivateProduct
      parameters: [{ name: sku, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Deactivated }
        '404': { $ref: '#/components/responses/NotFound' }
  /categories:
    get:
      operationId: listCategories
      description: The category tree as a flat list, parents before children within a branch.
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 500 } }
      responses:
        '200':
          description: Categories ordered by (parent_id, position, id)
          content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Category' } }, next_cursor: { type: [string, 'null'] } } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
    put:
      operationId: putCategories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categories]
              properties:
                categories: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/CategoryInput' } }
      responses:
        '200': { description: Upserted, content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { upserted: { type: integer } } } } } } } }
  /payouts:
    get:
      operationId: listPayouts
      description: >-
        The processors' payouts (Stripe payouts, PayPal withdrawals), ordered by created_at, provider, id ascending.
        Without provider, every payout-capable processor on the store is merged. Needs the orders scope.
      parameters:
        - { name: provider, in: query, schema: { type: string, enum: [stripe, paypal] } }
        - { name: created_since, in: query, schema: { type: string, format: date-time }, description: 'Inclusive; defaults to 90 days ago' }
        - { name: cursor, in: query, schema: { type: string }, description: 'Opaque; echo next_cursor' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Payouts oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Payout' } }
                  next_cursor: { type: [string, 'null'] }
                  providers: { type: array, items: { type: string }, description: 'Payout-capable processors on this store' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '424': { $ref: '#/components/responses/ProcessorPermissionMissing' }
  /payouts/{provider}/{id}:
    get:
      operationId: getPayout
      description: One payout; line_count is filled except for a Stripe payout of more than 1,000 lines (null). Page the lines to exhaustion.
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [stripe, paypal] } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Payout' }
        '404': { $ref: '#/components/responses/NotFound' }
        '424': { $ref: '#/components/responses/ProcessorPermissionMissing' }
  /payouts/{provider}/{id}/lines:
    get:
      operationId: listPayoutLines
      description: >-
        What the payout is made of, in the payout currency. gross - fee = net on every line, and the net of a payout's
        lines sums to its amount (Stripe's own payout row is excluded).
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [stripe, paypal] } }
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string }, description: 'Opaque; echo next_cursor' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
      responses:
        '200':
          description: Lines
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PayoutLine' } }
                  next_cursor: { type: [string, 'null'] }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '424': { $ref: '#/components/responses/ProcessorPermissionMissing' }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
  responses:
    NotFound: { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: Conflict, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unprocessable: { description: Validation failed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    RateLimited: { description: Too many failures from this address; try later, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    ProcessorPermissionMissing:
      description: >-
        The processor refused the store's key (HTTP 401/403). error.code is processor_permission_missing and
        error.details is { provider, permission } with permission one of "Payouts: Read", "Balance: Read",
        "Balance transaction sources: Read", "Account: Read" (Stripe restricted key), "Transaction search"
        (PayPal app feature) or "API credentials" (PayPal refused the client id and secret).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Error:
      type: object
      properties: { error: { type: object, properties: { code: { type: string }, message: { type: string }, details: { type: [object, 'null'] } } } }
    Money:
      type: object
      required: [amount, currency]
      properties: { amount: { type: integer }, currency: { type: string, minLength: 3, maxLength: 3 } }
    Address:
      type: object
      properties:
        name: { type: [string, 'null'] }
        line1: { type: [string, 'null'] }
        line2: { type: [string, 'null'] }
        city: { type: [string, 'null'] }
        state: { type: [string, 'null'] }
        postal_code: { type: [string, 'null'] }
        country: { type: [string, 'null'], description: ISO 3166-1 alpha-2 }
    HealthEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            name: { type: string }
            url: { type: string }
            currency: { type: string }
            locale: { type: string }
            version: { type: string, description: Store platform version }
            counts: { type: object, properties: { products: { type: integer }, categories: { type: integer }, orders: { type: integer }, customers: { type: integer }, quotes: { type: integer } } }
            owner_configured: { type: boolean, description: True once an owner exists; false means `npm run owner:create` has not been run and nobody can approve a connection yet }
            connection:
              description: The connection this request authenticated as; null for the STORE_API_KEY secret
              oneOf:
                - type: 'null'
                - { type: object, properties: { id: { type: string }, name: { type: string }, tenant: { type: [string, 'null'] } } }
            time: { type: string, format: date-time }
    Connection:
      type: object
      properties:
        id: { type: string, description: con_… }
        name: { type: string }
        tenant: { type: [string, 'null'], description: The consumer's display name for itself (the SKU.io tenant) }
        scopes: { type: array, items: { type: string, enum: [orders, payments, fulfillments, inventory, catalog, quotes] } }
        key_prefix: { type: [string, 'null'], description: First characters of the key, for display only }
        created_at: { type: string, format: date-time }
        issued_at: { type: [string, 'null'], format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
    TokenRequest:
      type: object
      required: [code, redirect_uri]
      properties:
        code: { type: string, description: The `code` query parameter the store appended to the redirect }
        redirect_uri: { type: string, format: uri, description: Exactly the redirect_uri sent to /admin/connect }
    TokenEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            api_key: { type: string, description: sk_store_… — shown once, store it encrypted }
            connection: { $ref: '#/components/schemas/Connection' }
    OrderLine:
      type: object
      properties:
        id: { type: string }
        sku: { type: string }
        name: { type: string }
        quantity: { type: integer }
        unit_amount: { $ref: '#/components/schemas/Money' }
        total_amount: { $ref: '#/components/schemas/Money' }
        fulfilled_quantity: { type: integer }
    Fulfillment:
      type: object
      properties:
        id: { type: string }
        external_id: { type: string }
        carrier: { type: [string, 'null'] }
        service: { type: [string, 'null'] }
        tracking_number: { type: [string, 'null'] }
        tracking_url: { type: [string, 'null'] }
        shipped_at: { type: [string, 'null'], format: date-time }
        lines: { type: array, items: { type: object, properties: { sku: { type: string }, quantity: { type: integer } } } }
        created_at: { type: string, format: date-time }
    FulfillmentInput:
      type: object
      required: [external_id, lines]
      properties:
        external_id: { type: string, maxLength: 64, description: The operations system's shipment id; makes the call idempotent }
        carrier: { type: [string, 'null'] }
        service: { type: [string, 'null'] }
        tracking_number: { type: [string, 'null'] }
        tracking_url: { type: [string, 'null'] }
        shipped_at: { type: [string, 'null'], format: date-time }
        lines: { type: array, minItems: 1, items: { type: object, required: [sku, quantity], properties: { sku: { type: string }, quantity: { type: integer, minimum: 1 } } } }
        notify_customer: { type: boolean, default: true }
    FulfillmentEnvelope:
      type: object
      properties: { data: { $ref: '#/components/schemas/Fulfillment' } }
    Order:
      type: object
      properties:
        id: { type: string }
        number: { type: string }
        status: { type: string, enum: [pending_payment, paid, processing, partially_fulfilled, fulfilled, cancelled, refunded] }
        payment:
          type: object
          properties:
            status: { type: string, enum: [unpaid, paid, refunded, failed] }
            provider: { type: [string, 'null'], description: stripe, manual, … }
            reference: { type: [string, 'null'] }
            method_label: { type: [string, 'null'] }
            paid_at: { type: [string, 'null'], format: date-time }
            amount_received:
              description: What the processor captured for this order (Stripe PaymentIntent amount_received; PayPal capture gross). Null for manual, bitcoin and btcpay orders, and until a Stripe/PayPal adapter reports it.
              oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }]
            fee:
              description: What the processor kept, in its settlement currency (Stripe balance_transaction.currency; PayPal paypal_fee.currency_code), which may differ from the order currency. Null until known. GET /orders/{id} asks the processor when it is still null on a paid stripe/paypal order.
              oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }]
            net:
              description: amount_received minus fee, in the settlement currency (Stripe balance_transaction.net; PayPal net_amount). Null until known.
              oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }]
            transaction_id: { type: [string, 'null'], description: "The processor's charge / capture id: Stripe ch_…, PayPal capture id." }
            fee_reported_at: { type: [string, 'null'], format: date-time, description: When the store recorded the fee. Recording it bumps the order's updated_at. }
        currency: { type: string }
        subtotal: { $ref: '#/components/schemas/Money' }
        shipping: { $ref: '#/components/schemas/Money' }
        tax: { $ref: '#/components/schemas/Money' }
        discount: { $ref: '#/components/schemas/Money' }
        discount_code: { type: [string, 'null'], description: The store discount code priced into the order (upper case). Partner attribution and commission are not exposed. }
        total: { $ref: '#/components/schemas/Money' }
        customer: { type: object, properties: { id: { type: string }, email: { type: string }, name: { type: [string, 'null'] }, phone: { type: [string, 'null'] } } }
        shipping_address: { $ref: '#/components/schemas/Address' }
        billing_address: { oneOf: [{ $ref: '#/components/schemas/Address' }, { type: 'null' }] }
        shipping_method: { type: [object, 'null'], properties: { code: { type: string }, name: { type: string } } }
        lines: { type: array, items: { $ref: '#/components/schemas/OrderLine' } }
        fulfillments: { type: array, items: { $ref: '#/components/schemas/Fulfillment' } }
        external_reference: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        metadata: { type: object, additionalProperties: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        paid_at: { type: [string, 'null'], format: date-time }
        cancelled_at: { type: [string, 'null'], format: date-time }
    OrderEnvelope:
      type: object
      properties: { data: { $ref: '#/components/schemas/Order' } }
    QuoteLine:
      type: object
      properties:
        id: { type: string }
        sku: { type: string }
        name: { type: string }
        quantity: { type: integer }
        list_amount: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: The catalog price when the buyer asked; reference only }
        unit_amount: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: The offered price; null until quoted }
        total_amount: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
    Quote:
      type: object
      properties:
        id: { type: string, description: quo_… }
        number: { type: string, description: With the store's quote prefix, e.g. Q1001 }
        status: { type: string, enum: [requested, quoted, accepted, declined, expired, cancelled] }
        currency: { type: string }
        customer: { type: object, properties: { id: { type: string }, email: { type: string }, name: { type: [string, 'null'] }, phone: { type: [string, 'null'] } }, description: A guest's request still has a customer — keyed by email, with no password or account }
        company: { type: [string, 'null'] }
        message: { type: [string, 'null'], description: What the buyer wrote with the request }
        shipping_address: { oneOf: [{ $ref: '#/components/schemas/Address' }, { type: 'null' }] }
        lines: { type: array, items: { $ref: '#/components/schemas/QuoteLine' } }
        subtotal: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        shipping: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        tax: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        total: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        note: { type: [string, 'null'], description: The offer's note to the buyer }
        expires_at: { type: [string, 'null'], format: date-time }
        external_reference: { type: [string, 'null'] }
        order_id: { type: [string, 'null'], description: The order placed when the buyer accepted }
        decline_reason: { type: [string, 'null'] }
        metadata: { type: object, additionalProperties: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        quoted_at: { type: [string, 'null'], format: date-time }
        accepted_at: { type: [string, 'null'], format: date-time }
        declined_at: { type: [string, 'null'], format: date-time }
        cancelled_at: { type: [string, 'null'], format: date-time }
    QuoteOffer:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [sku, quantity, unit_amount]
            properties:
              sku: { type: string }
              name: { type: [string, 'null'], description: Required for a SKU the store does not list }
              quantity: { type: integer, minimum: 1 }
              unit_amount: { $ref: '#/components/schemas/Money' }
        shipping: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        tax: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        expires_at: { type: [string, 'null'], format: date-time, description: Must be in the future; null is open-ended }
        note: { type: [string, 'null'], maxLength: 4000 }
        notify_customer: { type: boolean, default: true }
    QuoteEnvelope:
      type: object
      properties: { data: { $ref: '#/components/schemas/Quote' } }
    Product:
      type: object
      description: A catalog product as the store holds it.
      required: [sku, name, slug, price, active]
      properties:
        sku: { type: string }
        name: { type: string }
        slug: { type: string }
        description_html: { type: [string, 'null'] }
        short_description_html: { type: [string, 'null'] }
        price: { $ref: '#/components/schemas/Money' }
        compare_at: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        attributes: { type: object, additionalProperties: { type: string }, description: '`{}` when empty, never an array' }
        active: { type: boolean }
        position: { type: integer }
        legacy_path: { type: [string, 'null'] }
        categories:
          type: array
          description: In the product's own order. slug and name are null for a link to a category the store never received.
          items: { type: object, properties: { id: { type: string }, slug: { type: [string, 'null'] }, name: { type: [string, 'null'] } } }
        images:
          type: array
          items: { type: object, properties: { url: { type: string, format: uri, description: 'Always absolute and publicly loadable. A stored filename or path is resolved to the URL the store serves it at; a URL pushed with PUT /products comes back unchanged.' }, alt: { type: [string, 'null'] }, position: { type: integer } } }
        inventory:
          type: [object, 'null']
          description: Null when the store holds no stock row for the SKU, which is not the same as zero.
          properties: { available: { type: integer }, allow_backorder: { type: boolean }, updated_at: { type: string, format: date-time } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Category:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: string }
        parent_id: { type: [string, 'null'] }
        slug: { type: string }
        name: { type: string }
        description_html: { type: [string, 'null'] }
        position: { type: integer }
        product_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProductInput:
      type: object
      required: [sku, name, price]
      properties:
        sku: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 255 }
        slug: { type: [string, 'null'], maxLength: 255 }
        description_html: { type: [string, 'null'] }
        short_description_html: { type: [string, 'null'] }
        price: { $ref: '#/components/schemas/Money' }
        compare_at_price: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        images: { type: array, items: { type: object, required: [url], properties: { url: { type: string }, alt: { type: [string, 'null'] } } } }
        category_ids: { type: array, items: { type: string } }
        attributes: { type: object, additionalProperties: { type: string } }
        active: { type: boolean, default: true }
        position: { type: integer }
    CategoryInput:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: [string, 'null'] }
        parent_id: { type: [string, 'null'] }
        description_html: { type: [string, 'null'] }
        image: { type: [object, 'null'], properties: { url: { type: string }, alt: { type: [string, 'null'] } } }
        position: { type: integer }
    Payout:
      type: object
      required: [id, provider, account_id, status, amount, arrival_date, created_at, method, destination_label, line_count]
      properties:
        id: { type: string, description: 'Stripe po_…; PayPal the withdrawal''s transaction id' }
        provider: { type: string, enum: [stripe, paypal] }
        account_id: { type: string, description: 'Stripe acct_…; PayPal merchant payer id (else the app client id)' }
        status: { type: string, enum: [pending, in_transit, paid, failed, canceled] }
        amount: { $ref: '#/components/schemas/Money', description: 'Negative for a debit (Stripe pulling money)' }
        arrival_date: { type: [string, 'null'], format: date }
        created_at: { type: string, format: date-time }
        method: { type: [string, 'null'], description: 'standard | instant (Stripe); withdrawal or the T-code (PayPal)' }
        destination_label: { type: [string, 'null'], examples: ['Bank ••6789'] }
        line_count: { type: [integer, 'null'], description: 'May be null in the list, and on GET /payouts/{provider}/{id} for a Stripe payout of more than 1,000 lines; page the lines to exhaustion' }
    PayoutLine:
      type: object
      required: [id, type, category, source_id, order_id, order_number, payment_reference, gross, fee, net, fee_details, created_at, available_on, description]
      properties:
        id: { type: string, description: 'Stripe txn_…; PayPal transaction id' }
        type: { type: string, description: 'The processor''s own type (Stripe balance transaction type; PayPal T-code)' }
        category: { type: string, enum: [charge, refund, dispute, dispute_reversal, fee, adjustment, reserve, transfer, other] }
        source_id: { type: [string, 'null'], description: 'Stripe ch_/py_/re_/du_…; PayPal the transaction id' }
        order_id: { type: [string, 'null'] }
        order_number: { type: [string, 'null'], description: 'Without the store''s number prefix' }
        payment_reference: { type: [string, 'null'], description: "The order's payment.reference (pi_…, PayPal capture id)" }
        gross: { $ref: '#/components/schemas/Money' }
        fee: { $ref: '#/components/schemas/Money', description: 'What the processor kept; negative when it gave a fee back' }
        net: { $ref: '#/components/schemas/Money', description: 'gross - fee' }
        fee_details:
          type: array
          items:
            type: object
            properties: { type: { type: string }, amount: { type: integer }, description: { type: [string, 'null'] } }
        created_at: { type: string, format: date-time }
        available_on: { type: [string, 'null'], format: date }
        description: { type: [string, 'null'] }
