        cancel_url: 'https://www.example-doors.com/shop/toyota/tacoma-95-04/toyota-tacoma-truck-1995-2004-vertical-lambo-doors/'
        metadata: { product_url: 'https://www.example-doors.com/shop/toyota/tacoma-95-04/…' }
    CheckoutCreated:
      value:
        id: chk_01J8X
