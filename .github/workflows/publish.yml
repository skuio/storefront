name: Publish

# Publishes @skuio/storefront and @skuio/cli to npm when a version tag (v0.5.0)
# is pushed. No token is stored anywhere: npm trusted publishing exchanges this
# workflow's OIDC identity for a one-time publish credential. Each package's
# npmjs.com settings name this repo and this workflow file as its trusted
# publisher; renaming the file breaks publishing until those settings follow.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - run: npm install -g npm@^11.5.1
      - name: The tag matches both package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for p in packages/sdk packages/cli; do
            v=$(node -p "require('./$p/package.json').version")
            [ "$v" = "$tag" ] || { echo "$p is $v but the tag is v$tag"; exit 1; }
          done
      - run: npm ci
      - run: npm run build && npm test
      # A version already on npm (e.g. published by hand) is skipped, not an error.
      - name: Publish
        run: |
          for w in @skuio/storefront @skuio/cli; do
            if npm view "$w@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
              echo "$w@${GITHUB_REF_NAME#v} is already on npm; skipping"
            else
              npm publish -w "$w" --access public
            fi
          done
