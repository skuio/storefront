name: Publish

# Publishes @skuio/storefront and @skuio/cli to npm when a version tag (v0.5.0)
# is pushed. No token is stored anywhere: npm trusted publishing exchanges this
# workflow's OIDC identity for a one-time publish credential. Each package's
# npmjs.com settings name this repo and this workflow file as its trusted
# publisher; renaming the file breaks publishing until those settings follow.
on:
  push:
    tags: ['v*']
  # Run by hand (or by an agent: `gh workflow run publish.yml --ref v0.6.0`) for a tag
  # whose push did not start the workflow. Must be run ON the tag: the version check
  # below compares the tag name with both package versions.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - run: npm install -g npm@^11.5.1
      - name: The tag matches both package versions
        run: |
          [ "$GITHUB_REF_TYPE" = "tag" ] || { echo "Run this on a version tag (gh workflow run publish.yml --ref vX.Y.Z), not on $GITHUB_REF_NAME"; exit 1; }
          tag="${GITHUB_REF_NAME#v}"
          for p in packages/sdk packages/cli; do
            v=$(node -p "require('./$p/package.json').version")
            [ "$v" = "$tag" ] || { echo "$p is $v but the tag is v$tag"; exit 1; }
          done
      - run: npm ci
      - run: npm run build && npm test
      # A version already on npm (e.g. published by hand) is skipped, not an error.
      #
      # `npm publish` can fail AFTER the version has landed: the v0.9.0 run got
      # "409 Conflict - Cannot publish over previously staged version" for a
      # publish that succeeded, which stopped the step before @skuio/cli; the
      # re-run then read a stale registry, published again and got 403. So a
      # failed publish is judged by the registry, polled for about a minute, and
      # never stops the other package from being published.
      - name: Publish
        run: |
          version="${GITHUB_REF_NAME#v}"
          on_npm() {
            for i in 1 2 3 4 5 6; do
              npm view "$1@$version" version --prefer-online >/dev/null 2>&1 && return 0
              sleep 10
            done
            return 1
          }
          failed=""
          for w in @skuio/storefront @skuio/cli; do
            if npm view "$w@$version" version --prefer-online >/dev/null 2>&1; then
              echo "$w@$version is already on npm; skipping"
            elif npm publish -w "$w" --access public; then
              echo "$w@$version published"
            elif on_npm "$w"; then
              echo "::warning::npm reported an error publishing $w@$version, but the version is on npm; treating it as published"
            else
              echo "::error::$w@$version did not publish"
              failed="$failed $w"
            fi
          done
          [ -z "$failed" ] || exit 1
